name: ${PLM_PROJECT_NAME:-plm-course}
services:
  db:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_DB: plm
      POSTGRES_USER: plm_owner
      POSTGRES_PASSWORD: training-only
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U plm_owner -d plm']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql
      - .:/workspace:ro
      - ./practice/output:/artifacts
  python:
    image: python:3.15.2-slim-bookworm@sha256:4e03260adeeebafccd084f3584e6b84823aba5651cfb53ef8a078ed441ddf9cd
    profiles: [tools]
    working_dir: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    volumes:
      - .:/workspace:ro
      - ./practice/output:/artifacts
    entrypoint: [python]
  java:
    build:
      context: ./practice/java
    profiles: [tools]
    working_dir: /workspace
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/plm
      JDBC_USER: plm_owner
      JDBC_PASSWORD: training-only
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace:ro
      - ./practice/output:/artifacts
    entrypoint: [java, -cp, /opt/postgresql.jar]
volumes:
  pgdata:
